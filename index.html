<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>医海拾玉</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f0e8;
      font-family: 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 整体布局 ── */
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      position: relative;
      overflow: hidden;
    }

    /* ── 远山背景 (SVG) ── */
    .bg-mountains {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%; height: 55%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── 水墨晕染圆 ── */
    .ink-circle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .ink-circle-1 {
      width: 520px; height: 520px;
      top: -120px; right: -80px;
      background: radial-gradient(circle, rgba(180,210,195,0.22) 0%, transparent 70%);
    }
    .ink-circle-2 {
      width: 380px; height: 380px;
      bottom: 60px; left: -80px;
      background: radial-gradient(circle, rgba(200,169,110,0.13) 0%, transparent 70%);
    }
    .ink-circle-3 {
      width: 260px; height: 260px;
      top: 40%; left: 38%;
      background: radial-gradient(circle, rgba(160,200,190,0.12) 0%, transparent 70%);
    }

    /* ── 主内容区 ── */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 60px;
      min-height: 100vh;
    }

    /* ── 经络装饰线 ── */
    .meridian-lines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ── 玉石装饰 ── */
    .jade-deco {
      position: fixed;
      pointer-events: none;
      z-index: 2;
    }

    /* ── 顶部小标签 ── */
    .top-tag {
      font-size: .72rem;
      letter-spacing: .35em;
      color: #8aac9a;
      margin-bottom: 40px;
      opacity: .8;
    }

    /* ── 主标题区 ── */
    .hero {
      text-align: center;
      margin-bottom: 64px;
    }
    .hero-zh {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 700;
      letter-spacing: .28em;
      color: #2c3e35;
      line-height: 1;
      text-shadow: 0 2px 24px rgba(90,138,114,0.12);
      margin-bottom: 20px;
    }
    .hero-en {
      font-size: .82rem;
      letter-spacing: .45em;
      color: #8aac9a;
      font-weight: 300;
      margin-bottom: 28px;
    }
    .hero-tagline {
      font-size: .95rem;
      color: #6b7e74;
      letter-spacing: .12em;
      line-height: 2;
    }

    /* ── 手部穴位图 SVG ── */
    .hand-illus {
      width: 220px;
      margin: 0 auto 56px;
      filter: drop-shadow(0 8px 24px rgba(90,138,114,0.15));
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    /* ── 功能入口卡片 ── */
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 60px;
    }
    .card {
      background: rgba(255,252,245,0.75);
      border: 1px solid rgba(180,210,195,0.5);
      border-radius: 14px;
      padding: 28px 28px 24px;
      width: 180px;
      text-align: center;
      cursor: pointer;
      transition: all .3s;
      backdrop-filter: blur(6px);
    }
    .card:hover {
      background: rgba(255,252,245,0.95);
      border-color: #8aac9a;
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(90,138,114,0.14);
    }
    .card-icon {
      width: 48px; height: 48px;
      margin: 0 auto 14px;
    }
    .card-name {
      font-size: .92rem;
      font-weight: 700;
      color: #2c3e35;
      letter-spacing: .1em;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: .75rem;
      color: #8aac9a;
      letter-spacing: .05em;
      line-height: 1.6;
    }

    /* ── 底部签名 ── */
    .footer-sig {
      font-size: .75rem;
      letter-spacing: .25em;
      color: #a0b5aa;
      margin-top: 12px;
    }
    .footer-sig span {
      display: inline-block;
      width: 20px; height: 1px;
      background: #c0d5ca;
      vertical-align: middle;
      margin: 0 10px;
    }

    /* ── 叶子飘落 ── */
    .leaf {
      position: fixed;
      pointer-events: none;
      z-index: 3;
      opacity: .55;
      animation: leaffall linear infinite;
    }
    @keyframes leaffall {
      0%   { transform: translateY(-40px) rotate(0deg); opacity: .55; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- 远山背景 -->
  <svg class="bg-mountains" viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 最远山 -->
    <path d="M0,280 C120,200 260,240 400,210 C520,185 620,230 720,205
             C840,178 950,220 1080,200 C1200,182 1320,215 1440,195 L1440,400 L0,400 Z"
          fill="rgba(180,210,195,0.18)"/>
    <!-- 中间山 -->
    <path d="M0,320 C80,270 200,300 320,265 C420,238 520,278 640,255
             C760,232 880,268 1000,248 C1120,228 1300,262 1440,240 L1440,400 L0,400 Z"
          fill="rgba(160,195,180,0.22)"/>
    <!-- 近山 -->
    <path d="M0,360 C100,330 240,348 380,328 C500,312 620,342 760,322
             C880,305 1020,335 1160,315 C1280,298 1380,330 1440,318 L1440,400 L0,400 Z"
          fill="rgba(140,180,165,0.28)"/>
    <!-- 地面 -->
    <path d="M0,385 L1440,385 L1440,400 L0,400 Z" fill="rgba(140,180,165,0.15)"/>
  </svg>

  <!-- 水墨晕染 -->
  <div class="ink-circle ink-circle-1"></div>
  <div class="ink-circle ink-circle-2"></div>
  <div class="ink-circle ink-circle-3"></div>

  <!-- 经络线装饰 -->
  <svg class="meridian-lines" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
    <!-- 左侧经络 -->
    <path d="M60,100 Q80,200 55,320 Q35,420 70,540 Q95,640 60,760"
          stroke="rgba(138,172,154,0.25)" stroke-width="1" fill="none" stroke-dasharray="4 8"/>
    <circle cx="60" cy="100" r="3" fill="rgba(138,172,154,0.35)"/>
    <circle cx="55" cy="320" r="3" fill="rgba(138,172,154,0.35)"/>
    <circle cx="70" cy="540" r="3" fill="rgba(138,172,154,0.35)"/>

    <!-- 右侧经络 -->
    <path d="M1380,150 Q1360,250 1385,370 Q1405,470 1375,590 Q1350,680 1380,800"
          stroke="rgba(138,172,154,0.2)" stroke-width="1" fill="none" stroke-dasharray="4 8"/>
    <circle cx="1380" cy="150" r="3" fill="rgba(138,172,154,0.3)"/>
    <circle cx="1385" cy="370" r="3" fill="rgba(138,172,154,0.3)"/>

    <!-- 顶部装饰横线 -->
    <line x1="200" y1="50" x2="540" y2="50" stroke="rgba(200,169,110,0.18)" stroke-width="1"/>
    <line x1="900" y1="50" x2="1240" y2="50" stroke="rgba(200,169,110,0.18)" stroke-width="1"/>
  </svg>

  <!-- 玉石装饰 -->
  <svg class="jade-deco" style="top:12%;right:8%;width:56px;height:56px;" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="28" cy="28" rx="24" ry="26" fill="rgba(160,205,185,0.45)" stroke="rgba(120,175,155,0.5)" stroke-width="1.5"/>
    <ellipse cx="28" cy="28" rx="14" ry="16" fill="none" stroke="rgba(120,175,155,0.4)" stroke-width="1"/>
    <ellipse cx="28" cy="28" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/>
    <!-- 光泽 -->
    <ellipse cx="22" cy="20" rx="5" ry="4" fill="rgba(255,255,255,0.35)" transform="rotate(-20,22,20)"/>
  </svg>

  <svg class="jade-deco" style="bottom:22%;left:6%;width:44px;height:44px;" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="22" cy="22" rx="18" ry="20" fill="rgba(160,205,185,0.38)" stroke="rgba(120,175,155,0.45)" stroke-width="1.2"/>
    <ellipse cx="22" cy="22" rx="10" ry="12" fill="none" stroke="rgba(120,175,155,0.35)" stroke-width="1"/>
    <ellipse cx="17" cy="16" rx="4" ry="3" fill="rgba(255,255,255,0.3)" transform="rotate(-15,17,16)"/>
  </svg>

  <svg class="jade-deco" style="top:55%;right:5%;width:36px;height:36px;" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="18" cy="18" rx="14" ry="16" fill="rgba(160,205,185,0.32)" stroke="rgba(120,175,155,0.4)" stroke-width="1"/>
    <ellipse cx="14" cy="12" rx="3" ry="2.5" fill="rgba(255,255,255,0.28)" transform="rotate(-20,14,12)"/>
  </svg>

  <!-- 叶子装饰 -->
  <svg class="leaf" style="left:15%;animation-duration:14s;animation-delay:-3s;width:22px;" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg">
    <path d="M12,2 Q20,8 18,18 Q14,26 12,28 Q10,26 6,18 Q4,8 12,2 Z" fill="#8aac9a"/>
    <line x1="12" y1="2" x2="12" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width=".8"/>
  </svg>
  <svg class="leaf" style="left:78%;animation-duration:18s;animation-delay:-8s;width:16px;" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg">
    <path d="M12,2 Q20,8 18,18 Q14,26 12,28 Q10,26 6,18 Q4,8 12,2 Z" fill="#a0b89a"/>
    <line x1="12" y1="2" x2="12" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width=".8"/>
  </svg>
  <svg class="leaf" style="left:50%;animation-duration:22s;animation-delay:-12s;width:18px;" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg">
    <path d="M12,2 Q20,8 18,18 Q14,26 12,28 Q10,26 6,18 Q4,8 12,2 Z" fill="#b0c8b0"/>
    <line x1="12" y1="2" x2="12" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width=".8"/>
  </svg>

  <!-- 主内容 -->
  <div class="content">
    <div class="top-tag">中医养生知识库</div>

    <!-- 手部穴位插图 -->
    <div class="hand-illus">
      <svg viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
        <!-- 手腕/手掌轮廓 (水墨感) -->
        <g opacity=".85">
          <!-- 手掌主体 -->
          <path d="M60,230 Q40,220 38,195 Q36,165 42,140 Q48,120 55,100 Q60,85 65,75
                   Q68,65 75,62 Q82,60 86,68 Q90,78 90,95
                   Q92,80 96,68 Q100,58 107,58 Q114,58 116,70 Q118,82 116,98
                   Q118,82 123,72 Q128,62 135,64 Q142,66 142,78 Q142,92 138,108
                   Q142,92 148,82 Q154,74 160,78 Q166,82 164,96 Q160,115 152,132
                   Q160,115 165,108 Q170,102 174,108 Q178,116 172,130 Q164,150 150,168
                   Q140,182 132,195 Q122,210 118,230 Z"
                fill="rgba(240,220,195,0.9)" stroke="rgba(160,120,80,0.35)" stroke-width="1.5" stroke-linejoin="round"/>

          <!-- 手指间隔线 (淡) -->
          <path d="M90,95 Q90,105 88,118" stroke="rgba(160,120,80,0.2)" stroke-width="1" fill="none"/>
          <path d="M116,98 Q115,108 113,120" stroke="rgba(160,120,80,0.2)" stroke-width="1" fill="none"/>
          <path d="M138,108 Q136,118 134,128" stroke="rgba(160,120,80,0.2)" stroke-width="1" fill="none"/>

          <!-- 手腕纹路 -->
          <path d="M52,200 Q85,212 118,208 Q148,204 165,192"
                stroke="rgba(160,120,80,0.18)" stroke-width="1" fill="none"/>
          <path d="M50,218 Q83,228 116,224 Q146,220 163,210"
                stroke="rgba(160,120,80,0.12)" stroke-width="1" fill="none"/>

          <!-- 内关穴 (核心) -->
          <circle cx="100" cy="215" r="10" fill="none" stroke="rgba(90,138,114,0.7)" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="100" cy="215" r="5" fill="rgba(90,138,114,0.55)"/>
          <circle cx="100" cy="215" r="2" fill="rgba(255,255,255,0.8)"/>

          <!-- 穴位标注线 -->
          <line x1="110" y1="208" x2="140" y2="192" stroke="rgba(90,138,114,0.55)" stroke-width="1"/>
          <text x="143" y="192" fill="rgba(90,138,114,0.85)" font-size="9" font-family="'Noto Serif SC',serif" letter-spacing="1">内关穴</text>

          <!-- 经络线 (手上) -->
          <path d="M100,215 Q98,190 97,165 Q96,145 98,120 Q100,100 102,80"
                stroke="rgba(90,138,114,0.35)" stroke-width="1" fill="none" stroke-dasharray="3 5"/>
          <path d="M100,215 Q105,190 108,162 Q110,140 108,115"
                stroke="rgba(90,138,114,0.2)" stroke-width="1" fill="none" stroke-dasharray="2 6"/>

          <!-- 小穴位点 -->
          <circle cx="98" cy="165" r="2.5" fill="rgba(90,138,114,0.4)"/>
          <circle cx="100" cy="120" r="2.5" fill="rgba(90,138,114,0.4)"/>
          <circle cx="102" cy="80"  r="2"   fill="rgba(90,138,114,0.3)"/>

          <!-- 按压的手指 (另一只手) -->
          <path d="M75,208 Q82,200 92,205 Q100,207 108,205 Q118,200 126,208
                   Q120,218 110,220 Q100,222 90,220 Q80,218 75,208 Z"
                fill="rgba(225,200,175,0.8)" stroke="rgba(160,120,80,0.3)" stroke-width="1"/>
          <!-- 指甲 -->
          <ellipse cx="100" cy="206" rx="6" ry="3" fill="rgba(240,220,210,0.7)" stroke="rgba(160,120,80,0.2)" stroke-width=".8"/>
        </g>

        <!-- 旁边叶子 -->
        <g transform="translate(155,230) rotate(-25)">
          <path d="M0,0 Q12,6 10,18 Q6,26 0,28 Q-6,26 -10,18 Q-12,6 0,0 Z"
                fill="rgba(120,175,140,0.65)"/>
          <line x1="0" y1="0" x2="0" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width=".8"/>
        </g>
        <g transform="translate(168,245) rotate(-10)">
          <path d="M0,0 Q8,4 7,12 Q4,18 0,19 Q-4,18 -7,12 Q-8,4 0,0 Z"
                fill="rgba(140,190,155,0.5)"/>
        </g>

        <!-- 玉石小珠 -->
        <ellipse cx="40" cy="250" rx="10" ry="11" fill="rgba(155,200,180,0.6)" stroke="rgba(100,160,140,0.4)" stroke-width="1"/>
        <ellipse cx="40" cy="250" rx="6" ry="7" fill="none" stroke="rgba(100,160,140,0.3)" stroke-width=".8"/>
        <ellipse cx="37" cy="246" rx="3" ry="2.5" fill="rgba(255,255,255,0.35)" transform="rotate(-20,37,246)"/>

        <ellipse cx="26" cy="238" rx="7" ry="8" fill="rgba(155,200,180,0.45)" stroke="rgba(100,160,140,0.35)" stroke-width=".8"/>
        <ellipse cx="24" cy="235" rx="2.5" ry="2" fill="rgba(255,255,255,0.3)" transform="rotate(-15,24,235)"/>
      </svg>
    </div>

    <!-- 文字 -->
    <div class="hero">
      <div class="hero-zh">医海拾玉</div>
      <div class="hero-en">YIHAI SHIYU · TCM KNOWLEDGE BASE</div>
      <div class="hero-tagline">
        汇聚陈玉琴 · 张宝旬 · 赵岩 精粹<br/>
        化繁为简，随手可查
      </div>
    </div>

    <!-- 功能卡片 -->
    <div class="cards">
      <div class="card">
        <svg class="card-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="20" fill="rgba(138,172,154,0.15)" stroke="rgba(138,172,154,0.4)" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="4"  fill="rgba(90,138,114,0.7)"/>
          <path d="M24,24 Q22,16 24,10" stroke="rgba(90,138,114,0.5)" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/>
          <path d="M24,24 Q32,22 38,24" stroke="rgba(90,138,114,0.4)" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/>
          <path d="M24,24 Q26,32 24,38" stroke="rgba(90,138,114,0.4)" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/>
          <path d="M24,24 Q16,26 10,24" stroke="rgba(90,138,114,0.3)" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/>
          <circle cx="24" cy="10" r="2" fill="rgba(90,138,114,0.5)"/>
          <circle cx="38" cy="24" r="2" fill="rgba(90,138,114,0.4)"/>
          <circle cx="24" cy="38" r="2" fill="rgba(90,138,114,0.4)"/>
          <circle cx="10" cy="24" r="2" fill="rgba(90,138,114,0.3)"/>
        </svg>
        <div class="card-name">穴位查询</div>
        <div class="card-desc">经络穴位<br/>一查即得</div>
      </div>

      <div class="card">
        <svg class="card-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="8" width="28" height="34" rx="4" fill="rgba(138,172,154,0.15)" stroke="rgba(138,172,154,0.4)" stroke-width="1.5"/>
          <line x1="16" y1="18" x2="32" y2="18" stroke="rgba(90,138,114,0.5)" stroke-width="1.2"/>
          <line x1="16" y1="24" x2="32" y2="24" stroke="rgba(90,138,114,0.4)" stroke-width="1.2"/>
          <line x1="16" y1="30" x2="26" y2="30" stroke="rgba(90,138,114,0.3)" stroke-width="1.2"/>
          <circle cx="14" cy="18" r="1.5" fill="rgba(200,169,110,0.7)"/>
          <circle cx="14" cy="24" r="1.5" fill="rgba(200,169,110,0.7)"/>
          <circle cx="14" cy="30" r="1.5" fill="rgba(200,169,110,0.7)"/>
        </svg>
        <div class="card-name">方剂速查</div>
        <div class="card-desc">经典方剂<br/>组方配伍</div>
      </div>

      <div class="card">
        <svg class="card-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="24" cy="26" rx="16" ry="18" fill="rgba(155,200,180,0.3)" stroke="rgba(100,160,140,0.45)" stroke-width="1.5"/>
          <ellipse cx="24" cy="26" rx="9" ry="11" fill="none" stroke="rgba(100,160,140,0.35)" stroke-width="1"/>
          <ellipse cx="20" cy="20" rx="4" ry="3" fill="rgba(255,255,255,0.4)" transform="rotate(-20,20,20)"/>
          <path d="M24,8 Q28,6 30,10" stroke="rgba(100,160,140,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="card-name">本草图鉴</div>
        <div class="card-desc">药材识别<br/>性味归经</div>
      </div>

      <div class="card">
        <svg class="card-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M24,10 Q30,14 34,22 Q38,30 34,38 Q28,44 24,42 Q20,44 14,38 Q10,30 14,22 Q18,14 24,10 Z"
                fill="rgba(138,172,154,0.2)" stroke="rgba(90,138,114,0.45)" stroke-width="1.5"/>
          <path d="M24,10 L24,42" stroke="rgba(90,138,114,0.3)" stroke-width="1" stroke-dasharray="2 3"/>
          <path d="M14,26 Q24,24 34,26" stroke="rgba(90,138,114,0.25)" stroke-width="1" fill="none"/>
          <circle cx="24" cy="26" r="3" fill="rgba(90,138,114,0.55)"/>
        </svg>
        <div class="card-name">养生方案</div>
        <div class="card-desc">因人制宜<br/>调养指南</div>
      </div>
    </div>

    <div class="footer-sig">
      <span></span>随手翻翻，轻松实用<span></span>
    </div>
  </div>

</div>
</body>
</html>
